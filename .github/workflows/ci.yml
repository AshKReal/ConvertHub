name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Тот же .env.example, что первый локальный запуск с нуля
      # (docs/SETUP.md) — до install: postinstall Prisma (prisma generate,
      # onlyBuiltDependencies в корневом package.json) сам читает
      # DATABASE_URL из .env. Значения из .env.example — placeholder-формы,
      # не секреты: юнит-тестам живая БД не нужна (TokenService/hash-ip.spec.ts
      # Prisma не трогают), env.ts проверяет форму значений, не подключение.
      - run: cp apps/api/.env.example apps/api/.env

      - run: pnpm install --frozen-lockfile

      # apps/api и apps/web резолвят @convert-hub/shared через
      # package.json#main/#types из dist/, не исходники напрямую
      # (.claude/rules/shared-package.md) — без сборки тайпчек не найдёт типы.
      - run: pnpm --filter @convert-hub/shared build

      # Типы @prisma/client генерируются из schema.prisma — без этого шага
      # тайпчек apps/api не увидит актуальные модели (например Identity, 008).
      - run: pnpm --filter api db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Спека 015. Реальный стек: e2e-слой apps/api (supertest + Postgres) и
    # браузерный минимум (Playwright — сам поднимает API на convert_hub_test
    # и ng serve). Отдельная job — тяжелее check, но независима от неё.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: convert_hub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: convert_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convert_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # .env.example уже указывает на localhost:5432 / localhost:6379 с
      # тем же user/pass, что сервисы выше — трогаем только LOCAL_STORAGE_DIR
      # (в .env.example это заглушечный путь; LocalDiskStorage падает на
      # старте, если каталога нет или он внутри репозитория).
      - run: |
          cp apps/api/.env.example apps/api/.env
          mkdir -p "$RUNNER_TEMP/ch-storage"
          sed -i "s|^LOCAL_STORAGE_DIR=.*|LOCAL_STORAGE_DIR=$RUNNER_TEMP/ch-storage|" apps/api/.env

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @convert-hub/shared build
      - run: pnpm --filter api db:generate

      # convert_hub уже создан сервисом; вторую БД — идемпотентно (retry шага
      # не должен падать на «уже существует»), затем миграции в обе
      # (apps/api читает convert_hub, Playwright-API — convert_hub_test).
      - env:
          PGPASSWORD: change-me
        run: |
          psql -h localhost -U convert_hub -d convert_hub -tc \
            "SELECT 1 FROM pg_database WHERE datname='convert_hub_test'" | grep -q 1 \
            || createdb -h localhost -U convert_hub convert_hub_test
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api db:migrate:test

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm --filter web e2e:typecheck
      - run: pnpm --filter api test:e2e
      - run: pnpm --filter web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    # Спека 016. Сборка образа apps/api (без публикации) + smoke: поднять его
    # против postgres/redis/minio и убедиться, что /health и /ready отвечают
    # 200. Независимо от check/e2e.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: convert_hub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: convert_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convert_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # MinIO не сервис-контейнером: GitHub `services:` не даёт передать
      # команду `server /data`, а образ без неё просто печатает help.
      - name: start minio + bucket
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-08T15-41-24Z server /data
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-08T15-39-49Z -c \
            "mc alias set l http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing l/convert-hub"

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: converthub-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: run image + smoke /health /ready
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production -e PORT=3000 -e CORS_ORIGIN=http://localhost:4200 \
            -e DATABASE_URL=postgresql://convert_hub:change-me@localhost:5432/convert_hub \
            -e REDIS_URL=redis://localhost:6379 \
            -e STORAGE_DRIVER=s3 -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_BUCKET=convert-hub -e S3_ACCESS_KEY_ID=minioadmin -e S3_SECRET_ACCESS_KEY=minioadmin \
            -e S3_FORCE_PATH_STYLE=true \
            -e LOCAL_STORAGE_DIR=/tmp/unused -e SIGNED_URL_SECRET=unused-in-s3-mode-32-plus-characters \
            -e JWT_SECRET=ci-smoke-jwt-secret-32-plus-characters -e METRICS_TOKEN=ci-metrics-16plus \
            -e SMTP_HOST=localhost -e SMTP_PORT=1025 -e SMTP_FROM=noreply@convert-hub.local \
            -e GOOGLE_CLIENT_ID=x.apps.googleusercontent.com -e GOOGLE_CLIENT_SECRET=x \
            -e GOOGLE_REDIRECT_URI=http://localhost:3000/v1/auth/google/callback \
            converthub-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then break; fi
            sleep 2
          done
          echo "health:" && curl -fsS http://localhost:3000/health
          echo "ready:"  && curl -fsS http://localhost:3000/ready
          curl -fsS http://localhost:3000/ready | grep -q '"status":"ok"'

      - name: logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs minio || true
