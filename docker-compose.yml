services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Prisma 6 (schema/query engine) не проходит SCRAM-SHA-256 при
      # подключении с хоста Windows через проброс порта Docker Desktop
      # (внутри сети контейнер-контейнер работает нормально) — только
      # для локальной dev-БД, продовый managed Postgres (спека 017) этого
      # не касается.
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Спека 015 (частично) — создаёт convert_hub_test на СВЕЖЕМ volume;
      # уже существующий volume не трогает (официальное поведение образа),
      # там БД создаётся вручную один раз (docs/SETUP.md).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Спека 009. Локальный SMTP-приёмник — apps/api шлёт письма сюда
  # (SMTP_HOST/PORT из apps/api/.env), веб-интерфейс на 8025 показывает
  # входящие, ничего никуда реально не уходит. Без healthcheck: образ
  # минимальный, в нём нет ни curl/wget, ни nc, чтобы его написать.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

  # Спека 016. S3-совместимое хранилище для STORAGE_DRIVER=s3 (умолчание всё
  # ещё local, docs/SETUP.md). В основном наборе, не под профилем: чтобы
  # `pnpm dev:api` снаружи мог работать в режиме s3 без `--profile full`.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый: создаёт бакет и выходит. Приложение само бакет не создаёт —
  # лишние права и размытая граница (specs/016 «Отвергнутые варианты»).
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-convert-hub}
      "

  # Спека 016. Образ бэкенда под профилем `full`: `docker compose up -d`
  # поднимает только инфраструктуру и не ломает dev-цикл с горячей
  # перезагрузкой (ARCHITECTURE.md §10); `docker compose --profile full up -d`
  # добавляет собранный api. Хосты — контейнерные (postgres/redis/minio),
  # не localhost.
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      S3_BUCKET: ${MINIO_BUCKET:-convert-hub}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      # LOCAL_STORAGE_DIR/SIGNED_URL_SECRET обязательны и в режиме s3 (заглушки).
      LOCAL_STORAGE_DIR: /tmp/converthub-unused
      SIGNED_URL_SECRET: unused-in-s3-mode-but-schema-requires-32-plus-chars
      JWT_SECRET: ${JWT_SECRET:-change-me-to-32-plus-random-characters-in-prod}
      METRICS_TOKEN: ${METRICS_TOKEN:-change-me-16-plus}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-noreply@convert-hub.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/v1/auth/google/callback}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  minio-data:
