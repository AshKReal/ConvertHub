services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Prisma 6 (schema/query engine) не проходит SCRAM-SHA-256 при
      # подключении с хоста Windows через проброс порта Docker Desktop
      # (внутри сети контейнер-контейнер работает нормально) — только
      # для локальной dev-БД, продовый managed Postgres (спека 017) этого
      # не касается.
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Спека 015 (частично) — создаёт convert_hub_test на СВЕЖЕМ volume;
      # уже существующий volume не трогает (официальное поведение образа),
      # там БД создаётся вручную один раз (docs/SETUP.md).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Спека 009. Локальный SMTP-приёмник — apps/api шлёт письма сюда
  # (SMTP_HOST/PORT из apps/api/.env), веб-интерфейс на 8025 показывает
  # входящие, ничего никуда реально не уходит. Без healthcheck: образ
  # минимальный, в нём нет ни curl/wget, ни nc, чтобы его написать.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

volumes:
  postgres-data:
