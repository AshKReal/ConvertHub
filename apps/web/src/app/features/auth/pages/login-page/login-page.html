<div class="mx-auto flex max-w-[400px] flex-col gap-6 px-6 py-24">
  <h1 class="text-center font-heading text-heading-lg text-text">{{ i18n.t('auth.login.title') }}</h1>

  @if (showError()) {
    <p
      class="rounded-md border border-danger bg-danger-subtle px-3 py-2 text-body-sm text-danger"
      role="alert"
    >
      {{ i18n.t('auth.login.error') }}
    </p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
    <app-input
      fieldId="login-email"
      [label]="i18n.t('auth.email')"
      type="email"
      [control]="form.controls.email"
      [errorMessage]="emailError"
      autocomplete="email"
    />
    <app-input
      fieldId="login-password"
      [label]="i18n.t('auth.password')"
      type="password"
      [control]="form.controls.password"
      [errorMessage]="passwordError"
      autocomplete="current-password"
    />
    <app-button type="submit" [disabled]="submitting()">{{ i18n.t('auth.login.submit') }}</app-button>

    <a
      routerLink="/forgot-password"
      class="text-center text-body-sm text-text-secondary no-underline hover:text-text"
    >
      {{ i18n.t('auth.login.forgotPassword') }}
    </a>
  </form>

  <div class="flex items-center gap-3 text-caption text-text-muted" aria-hidden="true">
    <span class="h-px flex-1 bg-hairline"></span>
    {{ i18n.t('auth.or') }}
    <span class="h-px flex-1 bg-hairline"></span>
  </div>

  <app-oauth-buttons (chosen)="onOauth()" />

  <p class="text-center text-body-sm text-text-secondary">
    {{ i18n.t('auth.login.noAccount') }}
    <a routerLink="/register" class="text-text">{{ i18n.t('auth.login.registerLink') }}</a>
  </p>
</div>
