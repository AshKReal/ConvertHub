<div class="flex h-16 items-center gap-3 border-b border-hairline px-4 last:border-b-0">
  <app-file-type-icon [category]="category()" />

  <div class="min-w-0 flex-1">
    <p class="flex min-w-0 items-baseline font-heading text-heading-sm text-text">
      <span class="truncate">{{ namePart() }}</span>
      <span class="shrink-0">{{ extensionPart() }}</span>
    </p>
    <p class="tnum truncate font-mono text-caption text-text-muted">
      {{ i18n.formatBytes(entry().sizeBytes) }} · {{ i18n.formatDate(entry().createdAt) }}
    </p>
  </div>

  <span
    class="shrink-0 rounded-full px-2.5 py-[3px] text-caption"
    [class]="entry().saved ? 'bg-success-subtle text-success' : 'bg-surface-muted text-text-secondary'"
  >
    {{ entry().saved ? i18n.t('files.badge.saved') : i18n.t('files.badge.temporary') }}
  </span>

  <button
    type="button"
    role="switch"
    [attr.aria-checked]="entry().saved"
    [attr.aria-label]="i18n.t('files.save.toggle')"
    class="relative h-5 w-9 shrink-0 rounded-full transition-colors duration-150"
    [class]="entry().saved ? 'bg-accent' : 'border border-strong bg-surface-muted'"
    (click)="toggled.emit()"
  >
    <span
      class="absolute top-0.5 h-4 w-4 rounded-full bg-surface transition-transform duration-150"
      [class]="entry().saved ? 'translate-x-[18px]' : 'translate-x-0.5'"
    ></span>
  </button>
</div>
