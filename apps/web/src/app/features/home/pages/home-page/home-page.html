<div class="mx-auto flex max-w-[1120px] flex-col items-center gap-12 px-6 py-24">
  <header class="flex max-w-[720px] flex-col items-center gap-3 text-center">
    <h1 class="font-heading text-display text-text">{{ i18n.t('home.title') }}</h1>
    <p class="text-body text-text-secondary">{{ i18n.t('home.subtitle') }}</p>
    <app-button variant="primary" [link]="['/convert', 'jpg-to-png']">
      {{ i18n.t('home.cta') }}
    </app-button>
  </header>

  <section class="flex w-full flex-col gap-6">
    <h2 class="font-heading text-heading text-text">{{ i18n.t('home.directions.heading') }}</h2>

    <div class="grid w-full grid-cols-1 gap-6 sm:grid-cols-2">
      @for (direction of directions; track direction.id) {
        <a
          class="block rounded-lg no-underline"
          [routerLink]="['/convert', direction.id]"
          [attr.aria-label]="
            i18n.t('direction.open', { from: direction.from, to: direction.to })
          "
        >
          <app-format-card
            [from]="direction.from"
            [to]="direction.to"
            [description]="i18n.t(descriptionKeys[direction.id])"
          />
        </a>
      }
    </div>
  </section>
</div>
