<div class="flex min-h-dvh flex-col">
  <header class="border-b border-hairline bg-surface">
    <div class="mx-auto flex h-16 max-w-[1120px] items-center justify-between px-6">
      <span class="text-heading-sm text-text">ConvertHub</span>

      <nav class="flex items-center gap-2">
        <!-- пункты навигации добавятся здесь позже -->
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-md text-text-secondary hover:bg-surface-muted"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
          (click)="themeService.toggle()"
        >
          @if (themeService.theme() === 'dark') {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
            </svg>
          } @else {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" />
            </svg>
          }
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-1">
    <ng-content />
  </main>
</div>
