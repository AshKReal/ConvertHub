<div class="rounded-lg border border-hairline bg-surface p-6">
  <svg class="h-6 w-6 text-text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    @switch (icon()) {
      @case ('image') {
        <rect x="3" y="4.5" width="18" height="15" rx="1.5" stroke-linejoin="round" />
        <circle cx="8.5" cy="9.5" r="1.5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 17l4.8-4.8a1 1 0 0 1 1.4 0L13 15l3.8-3.8a1 1 0 0 1 1.4 0L20.5 13.5" />
      }
      @case ('document-lines') {
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20V4a.5.5 0 0 1 .5-.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 3.5V7a1 1 0 0 0 1 1h3.5" />
        <path stroke-linecap="round" d="M9.5 13h5M9.5 16h5M9.5 10h2.5" />
      }
      @default {
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20V4a.5.5 0 0 1 .5-.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 3.5V7a1 1 0 0 0 1 1h3.5" />
      }
    }
  </svg>

  <div class="mt-3 text-heading-sm text-text">{{ from() }} → {{ to() }}</div>
  <p class="mt-2 text-body-sm text-text-secondary">{{ description() }}</p>
</div>
