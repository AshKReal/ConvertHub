<div
  class="h-full rounded-lg border border-hairline bg-surface p-6 transition-colors duration-150 hover:border-accent-hover"
>
  <div class="flex items-center gap-3">
    <span
      class="flex h-11 min-w-11 items-center justify-center rounded-md border border-hairline bg-canvas px-2 text-label text-text-secondary"
    >
      {{ from() }}
    </span>

    <svg class="h-4 w-4 shrink-0 text-text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </svg>

    <span
      class="flex h-11 min-w-11 items-center justify-center rounded-md bg-accent px-2 text-label text-on-accent"
    >
      {{ to() }}
    </span>
  </div>

  <div class="mt-4 font-heading text-heading-sm text-text">{{ from() }} → {{ to() }}</div>
  <p class="mt-2 text-body-sm text-text-secondary">{{ description() }}</p>
</div>
